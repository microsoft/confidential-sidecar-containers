services:
  proxy:
    image: $REGISTRY/skr/proxy:$TAG
    network_mode: "host"
    build:
      context: .
      dockerfile: proxy.Dockerfile
  sidecar:
    image: ${SKR_IMAGE:-${REGISTRY}/skr/sidecar:${TAG}}
    network_mode: "host"
    build:
      context: ../../
      dockerfile: docker/skr/Dockerfile.skr
