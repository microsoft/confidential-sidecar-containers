# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CI"

permissions:
   id-token: write
   contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      location:
        description: The region to deploy ACIs to
        type: string
      policy_type:
        description: The policy type to use
        type: string
  workflow_call:
    inputs:
      location:
        description: The region to deploy ACIs to
        type: string
      policy_type:
        description: The policy type to use
        type: string

env:
  BASE_ID: ${{ github.run_id }}-${{ github.run_number }}-${{ inputs.location }}-${{ inputs.policy_type }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'go' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Jav).
    # If this step fails, then you should remove it and run the build manually (see below)
    #- name: Autobuild
    #  uses: github/codeql-action/autobuild@v2

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    - run: |
       echo "Run, Build Application using script"
       bash ./buildall.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  build-linux:
    name: Go Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Sets up the Golang for running unit tests
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.x"

    - name: Go Build
      run: go build -v ./...

    - name: Go Tests
      run: |
        # Can't use `go test -v ./...` because some of the tests depend on SEV-SNP or Confidential ACI features
        go test -v ./... -tags skip_e2e,skip_snp_required

  build-windows:
    name: Build Windows Binaries and SKR Image
    runs-on: windows-2025
    outputs:
      image: ${{ steps.push-skr.outputs.image }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.x"

    - name: Build Windows Executables
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        go build ./tools/importkey
        go build -o get-snp-report.exe ./cmd/snp-report
        go build -o skr.exe -ldflags="-s -w" ./cmd/skr
      env:
        GOOS: windows
        GOARCH: amd64

    - name: Build Windows SKR Image
      run: |
        Start-Service docker
        docker build --pull -t skr-windows -f docker\skr\Dockerfile.skr.windows .

    - name: Log into Azure
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
        tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
        subscription-id: ${{ vars.SUBSCRIPTION }}

    - name: Log into Azure Container Registry
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: |
        source cacitesting.env
        echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
        az acr login --name "$REGISTRY"

    - name: Push Windows SKR Image
      id: push-skr
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      shell: pwsh
      env:
        IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}-windows
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $image = "$env:REGISTRY/skr:$env:IMAGE_TAG"
        docker tag skr-windows $image
        docker push $image
        $digest = az acr repository show --name $env:REGISTRY --image "skr:$env:IMAGE_TAG" --query digest -o tsv
        if ($digest -notmatch '^sha256:[0-9a-f]{64}$') {
          throw 'Cannot retrieve the published Windows SKR digest.'
        }
        "image=$env:REGISTRY/skr@$digest" >> $env:GITHUB_OUTPUT

  build-skr:
    name: Build Linux SKR Images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-skr.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux SKR Images
        shell: bash
        env:
          TAG: ${{ env.BASE_ID }}
        run: |
          source cacitesting.env
          docker compose -f tests/skr/docker-compose.yml build

      - name: Log into Azure
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Publish Linux SKR Images
        id: push-skr
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TAG: ${{ env.BASE_ID }}
          IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}-linux
        run: |
          source cacitesting.env
          az acr login --name "$REGISTRY"
          docker compose -f tests/skr/docker-compose.yml push
          image="$REGISTRY/skr:$IMAGE_TAG"
          docker tag "$REGISTRY/skr/sidecar:$TAG" "$image"
          docker push "$image"
          digest="$(az acr repository show --name "$REGISTRY" --image "skr:$IMAGE_TAG" --query digest -o tsv)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cannot retrieve the published Linux SKR digest." >&2
            exit 1
          fi
          echo "image=$REGISTRY/skr@$digest" >> "$GITHUB_OUTPUT"

  publish-skr:
    name: Publish Multi-OS SKR Image
    needs: [build-skr, build-windows]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-skr.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Publish Multi-OS SKR Image
        id: push-skr
        shell: bash
        env:
          IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
          LINUX_IMAGE: ${{ needs.build-skr.outputs.image }}
          WINDOWS_IMAGE: ${{ needs.build-windows.outputs.image }}
        run: |
          source cacitesting.env
          image="$REGISTRY/skr:$IMAGE_TAG"
          az acr login --name "$REGISTRY"
          docker manifest create "$image" "$LINUX_IMAGE" "$WINDOWS_IMAGE"
          docker manifest inspect "$image" | python3 -c '
          import json, sys
          manifests = json.load(sys.stdin)["manifests"]
          platforms = [manifest["platform"] for manifest in manifests]
          if len(platforms) != 2 or {(p["os"], p["architecture"]) for p in platforms} != {("linux", "amd64"), ("windows", "amd64")}:
              raise SystemExit("SKR manifest must contain exactly Linux/amd64 and Windows/amd64.")
          if not next(p for p in platforms if p["os"] == "windows").get("os.version"):
              raise SystemExit("Windows SKR manifest is missing its OS version.")
          '
          docker manifest push --purge "$image"
          digest="$(az acr repository show --name "$REGISTRY" --image "skr:$IMAGE_TAG" --query digest -o tsv)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cannot retrieve the published multi-OS SKR digest." >&2
            exit 1
          fi
          image="$REGISTRY/skr@$digest"
          echo "Multi-OS SKR image: $image"
          docker manifest inspect "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  test-skr:
    name: Test SKR
    needs: publish-skr
    runs-on: ubuntu-latest
    env:
      SKR_IMAGE: ${{ needs.publish-skr.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install c_aci_testing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-c-aci-testing.sh

      - name: Install Azure CLI
        env:
          AZ_CLI_VERSION: 2.89.1
        run: ./scripts/install-az-cli.sh

      - name: Setup Docker
        run: sudo usermod -aG docker $USER

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      # Deployment is separated from testing to avoid the AZ CLI login timeout
      - name: Deploy the SKR container group
        env:
          ID: skr-${{ env.BASE_ID }}-${{ github.run_attempt }}
          TAG: ${{ env.BASE_ID }}
        run: |
          source cacitesting.env
          export LOCATION=${{ env.LOCATION }}
          c-aci-testing target run tests/skr \
            --deployment-name $ID \
            --prefer-pull \
            --no-cleanup

      - name: Re-Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Verify deployed SKR image
        shell: bash
        env:
          ID: skr-${{ env.BASE_ID }}-${{ github.run_attempt }}
        run: |
          source cacitesting.env
          az container show --resource-group "$RESOURCE_GROUP" --name "$ID" \
            --query "{osType:osType,images:containers[?name=='http-sidecar' || name=='grpc-sidecar'].image}" -o json \
            | python3 -c '
          import json, os, sys
          deployment = json.load(sys.stdin)
          image = os.environ["SKR_IMAGE"]
          if deployment["osType"] != "Linux" or deployment["images"] != [image, image]:
              raise SystemExit("Both Linux SKR containers must use the published multi-OS digest.")
          print(json.dumps(deployment, indent=3))
          '

      - name: Test SKR
        env:
          ID: skr-${{ env.BASE_ID }}-${{ github.run_attempt }}
          TAG: ${{ env.BASE_ID }}
          ATTESTATION_ENDPOINT: ${{ vars.ATTESTATION_ENDPOINT }}
          HSM_ENDPOINT: ${{ vars.HSM_ENDPOINT }}
        run: |
          source cacitesting.env
          export LOCATION=${{ env.LOCATION }}
          python -m unittest discover -s tests/skr

  test-encfs:
    name: Test EncFS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install c_aci_testing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-c-aci-testing.sh

      - name: Install Azure CLI
        env:
          AZ_CLI_VERSION: 2.89.1
        run: ./scripts/install-az-cli.sh

      - name: Setup Docker
        run: sudo usermod -aG docker $USER

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Test ENCFS
        env:
          ID: encfs-${{ env.BASE_ID }}
          TAG: ${{ env.BASE_ID }}
          ATTESTATION_ENDPOINT: ${{ vars.ATTESTATION_ENDPOINT }}
          HSM_ENDPOINT: ${{ vars.HSM_ENDPOINT }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_CONTAINER_NAME: ${{ vars.STORAGE_CONTAINER_NAME }}
        run: |
          source cacitesting.env
          export LOCATION=${{ env.LOCATION }}
          python -m unittest discover -s tests/encfs
