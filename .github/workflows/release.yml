name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write # needed to create release
  attestations: write
  packages: write
      
env:
  GO_VERSION: "1.27.x"

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux Executables
        run: |
          pushd tools/get-snp-report && make && popd
          cp -a tools/get-snp-report/bin/* .
          go build ./tools/importkey
          go build ./cmd/skr

      - name: Upload Executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-linux
          path: |
            get-snp-report
            verbose-report
            importkey
            skr

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows Executables
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go build ./tools/importkey
          # Match Dockerfile.skr.windows: name snp-report as get-snp-report.exe and strip skr.exe debug symbols.
          go build -o get-snp-report.exe ./cmd/snp-report
          go build -o skr.exe -ldflags="-s -w" ./cmd/skr
        env:
          GOOS: windows
          GOARCH: amd64
  
      - name: Upload Executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-windows
          path: |
            importkey.exe
            get-snp-report.exe
            skr.exe

  create_release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # needed to avoid a bug where imageId and digest output are the same
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.18.0

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
          tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Log in to Azure Container Registry
        run: | 
          source cacitesting.env
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV
          az acr login --name $REGISTRY

      - name: Publish Secure Key Release Sidecar Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-skr
        with:
          context: ./
          file: docker/skr/Dockerfile.skr
          push: true
          tags: ${{ env.REGISTRY }}/skr:${{ github.ref_name }}

      - name: Generate SKR artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/skr
          subject-digest: '${{steps.build-skr.outputs.digest}}'
          push-to-registry: true

      - name: Publish Encrypted Filesystem Sidecar Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-encfs
        with:
          context: ./
          file: docker/encfs/Dockerfile.encfs
          push: true
          tags: ${{ env.REGISTRY }}/encfs:${{ github.ref_name }}

      - name: Generate ENCFS artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/encfs
          subject-digest: '${{steps.build-encfs.outputs.digest}}'
          push-to-registry: true
          
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: |
            get-snp-report
            verbose-report
            importkey.exe
            importkey
            skr
            get-snp-report.exe
            skr.exe